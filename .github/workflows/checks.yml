name: Notes frontend checks
on:
  push:
    branches: [upgrade/notes-v1, master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: notes-web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
      - run: npm run test:toolchain
